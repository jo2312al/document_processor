<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso administrativo</title>
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-card">
            <div class="brand login-brand">
                <h1>Consola documental</h1>
                <p>Ingresa para administrar tipos documentales, plantillas, aprendizaje y modelos.</p>
            </div>
            {% if error %}<div class="alerta-error">{{ error }}</div>{% endif %}
            <form method="post" class="stack">
                <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
                <label>Contrasena<input name="password" type="password" autocomplete="current-password" required></label>
                <button type="submit">Entrar</button>
            </form>
            <a href="/analizador">Ir al analizador publico</a>
        </section>
    </main>
</body>
</html>
