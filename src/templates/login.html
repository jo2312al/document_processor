<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="bg-body-tertiary">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card shadow-sm border-0 login-card">
            <div class="card-body p-4 p-md-5">
                <div class="mb-4 pb-3 border-bottom">
                    <span class="badge text-bg-primary mb-3">Administracion</span>
                    <h1 class="h2 fw-bold mb-2">Consola documental</h1>
                    <p class="text-secondary mb-0">Ingresa para administrar tipos documentales, plantillas, aprendizaje y modelos.</p>
                </div>
                {% if error %}<div class="alert alert-danger fw-semibold">{{ error }}</div>{% endif %}
                <form method="post" class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input class="form-control form-control-lg" name="usuario" autocomplete="username" required autofocus>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold">Contrasena</label>
                        <input class="form-control form-control-lg" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <div class="col-12 d-grid">
                        <button class="btn btn-primary btn-lg fw-bold" type="submit">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
                        </button>
                    </div>
                </form>
                <a class="btn btn-link fw-bold px-0 mt-3" href="/analizador">
                    <i class="bi bi-file-earmark-search me-2"></i>Ir al analizador publico
                </a>
            </div>
        </section>
    </main>
</body>
</html>
