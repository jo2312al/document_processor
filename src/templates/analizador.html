<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador de documentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand fw-bold text-primary" href="/analizador">
                <i class="bi bi-file-earmark-search me-2"></i>Analizador de documentos
            </a>
            <a class="btn btn-outline-primary btn-sm" href="/login">Administracion</a>
        </div>
    </nav>

    <main class="container-fluid px-3 px-lg-4 py-4">
        <div class="row g-4">
            <section class="col-12 col-xl-7">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h1 class="h4 text-primary fw-bold mb-0">Documento original</h1>
                    </div>
                    <div class="card-body">
                        <div class="pdf-preview border border-2 border-dashed rounded bg-light">
                            <div id="pdf-placeholder" class="text-center text-secondary p-4">
                                <i class="bi bi-file-earmark-pdf display-4 d-block mb-3"></i>
                                <p class="mb-0">Selecciona un PDF para previsualizarlo.</p>
                            </div>
                            <iframe id="pdf-frame" class="d-none w-100 h-100 border-0" src=""></iframe>
                        </div>
                    </div>
                </div>
            </section>

            <section class="col-12 col-xl-5">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white">
                        <h2 class="h4 text-primary fw-bold mb-0">Extraccion de datos</h2>
                    </div>
                    <div class="card-body d-flex flex-column gap-4">
                        <form id="upload-form" class="row g-3">
                            <div class="col-12">
                                <label class="form-label fw-semibold">Tipo de documento</label>
                                <select id="tipo-documento" name="id_tipo_documento" class="form-select form-select-lg"></select>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Archivo PDF</label>
                                <input id="pdf-file" name="file" type="file" accept=".pdf" class="form-control form-control-lg">
                            </div>
                            <div class="col-12 d-grid">
                                <button id="submit-btn" type="submit" class="btn btn-success btn-lg fw-bold">
                                    <i class="bi bi-cpu me-2"></i>Analizar documento
                                </button>
                            </div>
                        </form>
                        <div id="loader" class="alert alert-primary d-none mb-0">
                            <span class="spinner-border spinner-border-sm me-2"></span>Procesando documento...
                        </div>
                        <pre id="results-pre" class="resultado-json flex-grow-1 mb-0"></pre>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const archivoPdf = document.getElementById('pdf-file');
        const visorPdf = document.getElementById('pdf-frame');
        const marcadorPdf = document.getElementById('pdf-placeholder');
        const formulario = document.getElementById('upload-form');
        const cargando = document.getElementById('loader');
        const resultado = document.getElementById('results-pre');
        const tipoDocumento = document.getElementById('tipo-documento');
        const tipoServicioSocial = 'carta_terminacion_servicio_social';

        async function cargarTiposDocumento() {
            const respuesta = await fetch('/tipos-documento');
            const datos = await respuesta.json();
            tipoDocumento.innerHTML = '';
            datos.tipos_documento.forEach(agregarOpcionDocumento);
            seleccionarTipoInicial(datos.tipos_documento);
        }

        function agregarOpcionDocumento(tipo) {
            const opcion = document.createElement('option');
            opcion.value = tipo.id_tipo_documento;
            opcion.textContent = tipo.nombre;
            tipoDocumento.appendChild(opcion);
        }

        function seleccionarTipoInicial(tipos) {
            const existeServicioSocial = tipos.some(tipo => tipo.id_tipo_documento === tipoServicioSocial);
            if (existeServicioSocial) tipoDocumento.value = tipoServicioSocial;
        }

        function mostrarPdfSeleccionado() {
            if (!archivoPdf.files.length) return;
            visorPdf.src = URL.createObjectURL(archivoPdf.files[0]);
            visorPdf.classList.remove('d-none');
            marcadorPdf.classList.add('d-none');
        }

        async function enviarDocumento(evento) {
            evento.preventDefault();
            if (!archivoPdf.files.length) return alert('Selecciona un archivo PDF.');
            await procesarDocumento();
        }

        async function procesarDocumento() {
            activarCarga();
            try {
                const datos = await solicitarExtraccion();
                mostrarResultado(datos, false);
            } catch (error) {
                mostrarResultado({ error: error.message }, true);
            } finally {
                cargando.classList.add('d-none');
            }
        }

        async function solicitarExtraccion() {
            const datosFormulario = new FormData();
            datosFormulario.append('file', archivoPdf.files[0]);
            datosFormulario.append('id_tipo_documento', tipoDocumento.value);
            datosFormulario.append('metodo_preprocesamiento', 'tesseract');
            const respuesta = await fetch('/extract', { method: 'POST', body: datosFormulario });
            const datos = await respuesta.json();
            if (!respuesta.ok) throw new Error(datos.error || 'Error desconocido');
            return datos;
        }

        function activarCarga() {
            cargando.classList.remove('d-none');
            resultado.textContent = '';
        }

        function mostrarResultado(datos, esError) {
            resultado.className = esError ? 'resultado-json text-danger mb-0' : 'resultado-json text-success mb-0';
            resultado.textContent = JSON.stringify(datos, null, 2);
        }

        archivoPdf.addEventListener('change', mostrarPdfSeleccionado);
        formulario.addEventListener('submit', enviarDocumento);
        cargarTiposDocumento().catch(() => agregarOpcionDocumento({ id_tipo_documento: tipoServicioSocial, nombre: 'Servicio social' }));
    </script>
</body>
</html>
